<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anchors Aweigh - Boat Day Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --panel: rgba(10, 22, 40, 0.97);
    --panel-2: rgba(14, 26, 43, 0.95);
    --text: #e8edf3;
    --muted: rgba(255, 255, 255, 0.58);
    --blue: #0066cc;
    --orange: #ff9900;
    --green: #2e8b57;
    --purple: #8e44ad;
    --red: #cc0000;
    --gold: #f0c040;
    --aqua: #46bcec;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0e1a2b;
    color: var(--text);
    font-family: "DM Sans", Arial, sans-serif;
  }

  #map {
    position: absolute;
    inset: 0 380px 0 0;
    background: #dde6ed;
  }

  .leaflet-tile-pane { filter: saturate(0.85) brightness(1.03); }
  .leaflet-container {
    background: #cfe4ee;
    font-family: "DM Sans", Arial, sans-serif !important;
  }
  .leaflet-control-attribution {
    font-size: 10px;
  }

  .marker-bubble {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #0e1a2b;
    border: 2.5px solid var(--blue);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0;
    transform: translate(-50%, -50%);
  }
  .marker-bubble.green { border-color: var(--green); }
  .marker-bubble.gold { border-color: #f59e0b; }
  .marker-bubble.purple { border-color: var(--purple); }
  .marker-bubble.red { border-color: var(--red); }

  .leaflet-popup-content-wrapper { border-radius: 10px; }
  .leaflet-popup-content {
    color: #1f2937;
    font-family: "DM Sans", Arial, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    margin: 10px 12px;
    max-width: 270px;
  }
  .leaflet-popup-content strong {
    color: #111827;
    display: block;
    font-family: "DM Serif Display", Georgia, serif;
    font-size: 15px;
    line-height: 1.25;
    margin-bottom: 4px;
  }
  .popup-meta {
    color: #4b5563;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 5px;
  }
  .popup-desc { color: #374151; }

  .timeline-panel {
    position: fixed;
    top: 0;
    right: 0;
    z-index: 1000;
    width: 380px;
    height: 100vh;
    overflow-y: auto;
    padding: 28px 24px 40px;
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    backdrop-filter: blur(20px);
    border-left: 1px solid rgba(70, 188, 236, 0.15);
    scrollbar-color: rgba(70, 188, 236, 0.3) transparent;
    scrollbar-width: thin;
  }
  .timeline-panel::-webkit-scrollbar { width: 5px; }
  .timeline-panel::-webkit-scrollbar-thumb {
    background: rgba(70, 188, 236, 0.3);
    border-radius: 4px;
  }

  .panel-header {
    margin-bottom: 6px;
    padding-bottom: 18px;
    border-bottom: 1px solid rgba(70, 188, 236, 0.12);
  }
  .panel-header h1 {
    color: #fff;
    font-family: "DM Serif Display", Georgia, serif;
    font-size: 28px;
    letter-spacing: 0;
    line-height: 1.12;
  }
  .panel-header .date {
    margin-top: 6px;
    color: rgba(70, 188, 236, 0.82);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .site-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }
  .site-nav a {
    min-height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 11px;
    border: 1px solid rgba(70, 188, 236, 0.22);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0;
    text-decoration: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .site-nav a:hover,
  .site-nav a.active {
    border-color: rgba(70, 188, 236, 0.58);
    background: rgba(70, 188, 236, 0.13);
  }
  .quick-card {
    margin-top: 14px;
    padding: 12px;
    border: 1px solid rgba(70, 188, 236, 0.16);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.055);
  }
  .quick-card strong {
    display: block;
    color: #fff;
    font-family: "DM Serif Display", Georgia, serif;
    font-size: 15px;
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .quick-card p {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
  }
  .quick-card a {
    color: #8bd7f5;
    font-weight: 800;
    text-decoration: none;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 14px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    color: rgba(255, 255, 255, 0.66);
    font-size: 10.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .legend-swatch {
    width: 18px;
    height: 3px;
    border-radius: 2px;
  }

  .timeline-list { padding-top: 1px; }
  .tl-item {
    position: relative;
    margin: 0 -8px;
    padding: 14px 8px 14px 44px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    display: block;
    text-align: left;
    transition: background 0.2s ease;
    width: calc(100% + 16px);
  }
  .tl-item:hover { background: rgba(70, 188, 236, 0.06); }
  .tl-item.active { background: rgba(70, 188, 236, 0.11); }
  .tl-item::before {
    content: "";
    position: absolute;
    left: 19px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: rgba(70, 188, 236, 0.15);
  }
  .tl-item:first-child::before { top: 22px; }
  .tl-item:last-child::before { bottom: calc(100% - 22px); }

  .tl-dot {
    position: absolute;
    left: 12px;
    top: 18px;
    z-index: 2;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid rgba(70, 188, 236, 0.6);
    background: #0e1a2b;
  }
  .tl-item.outbound .tl-dot { background: var(--blue); border-color: var(--blue); }
  .tl-item.walk .tl-dot { background: var(--orange); border-color: var(--orange); }
  .tl-item.stop .tl-dot { background: var(--gold); border-color: var(--gold); }
  .tl-item.meet .tl-dot { background: var(--purple); border-color: var(--purple); }
  .tl-item.chill .tl-dot { background: var(--green); border-color: var(--green); }
  .tl-item.ret .tl-dot { background: var(--red); border-color: var(--red); }

  .tl-time {
    margin-bottom: 3px;
    color: var(--blue);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.3px;
  }
  .tl-item.walk .tl-time { color: var(--orange); }
  .tl-item.stop .tl-time { color: var(--gold); }
  .tl-item.meet .tl-time { color: #b07acd; }
  .tl-item.chill .tl-time { color: #3fb56f; }
  .tl-item.ret .tl-time { color: #e36464; }

  .tl-title {
    color: #fff;
    font-family: "DM Serif Display", Georgia, serif;
    font-size: 16px;
    letter-spacing: 0;
    line-height: 1.26;
  }
  .tl-desc {
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
  }
  .tl-tag {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.4px;
    line-height: 1.45;
    text-transform: uppercase;
  }
  .tag-blue { background: rgba(0, 102, 204, 0.18); color: #3a8fdb; }
  .tag-walk { background: rgba(255, 153, 0, 0.18); color: var(--orange); }
  .tag-stop { background: rgba(240, 192, 64, 0.16); color: var(--gold); }
  .tag-meet { background: rgba(142, 68, 173, 0.2); color: #b07acd; }
  .tag-chill { background: rgba(46, 139, 87, 0.2); color: #3fb56f; }
  .tag-red { background: rgba(204, 0, 0, 0.2); color: #e36464; }

  .load-error {
    position: absolute;
    left: 22px;
    top: 22px;
    z-index: 900;
    max-width: 320px;
    padding: 14px 16px;
    border-radius: 8px;
    background: rgba(14, 26, 43, 0.94);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
    color: #fff;
    font-size: 13px;
    line-height: 1.45;
  }
  .wake-easter {
    position: relative;
    width: 50px;
    height: 30px;
    opacity: 0.96;
    filter: drop-shadow(0 4px 7px rgba(82, 28, 106, 0.48));
  }
  .wake-easter::before {
    content: "";
    position: absolute;
    top: 7px;
    right: 3px;
    width: 18px;
    height: 9px;
    border-radius: 8px 3px 8px 3px;
    background: var(--purple);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
    transform: skewX(-18deg) rotate(-7deg);
  }
  .wake-easter::after,
  .wake-easter span::before,
  .wake-easter span::after {
    content: "";
    position: absolute;
    left: 2px;
    height: 2px;
    border-radius: 999px;
    background: rgba(142, 68, 173, 0.96);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.78);
  }
  .wake-easter::after {
    top: 7px;
    width: 20px;
    transform: rotate(-11deg);
  }
  .wake-easter span::before {
    top: 13px;
    width: 26px;
    transform: rotate(-4deg);
  }
  .wake-easter span::after {
    top: 18px;
    width: 15px;
    transform: rotate(8deg);
  }

  @media (max-width: 820px) {
    #map { inset: 0 320px 0 0; }
    .timeline-panel { width: 320px; }
    .panel-header h1 { font-size: 25px; }
  }

  @media (max-width: 600px) {
    #map { inset: 0; }
    .timeline-panel {
      top: auto;
      bottom: 0;
      width: 100%;
      height: 58vh;
      padding: 22px 22px 34px;
      border-top: 1px solid rgba(70, 188, 236, 0.2);
      border-left: 0;
      border-radius: 18px 18px 0 0;
    }
    .panel-header h1 { font-size: 24px; }
    .tl-title { font-size: 15px; }
    .site-nav a { flex: 1 1 calc(50% - 8px); }
  }
</style>
</head>
<body>
<div id="map"></div>

<aside class="timeline-panel" id="timeline" aria-label="Boating day itinerary">
  <div class="panel-header">
    <h1>Anchors Aweigh</h1>
    <div class="date">Thursday, May 28, 2026</div>
    <nav class="site-nav" aria-label="Boat day pages">
      <a href="index.html" class="active">Map</a>
      <a href="itinerary.html">Itinerary</a>
      <a href="itinerary.html#packing">Packing</a>
      <a href="itinerary.html#weather">Weather</a>
      <a href="itinerary.pdf">PDF</a>
    </nav>
    <div class="quick-card">
      <strong>Lake Washington sendoff</strong>
      <p>For Drs. Hana &amp; Ruth, captained by Mintay. Sunny and warm, with a hoodie-friendly ride home. <a href="itinerary.html">Open the full itinerary</a>.</p>
    </div>
    <div class="legend" aria-label="Route legend">
      <div class="legend-item"><div class="legend-swatch" style="background:#0066cc"></div>Outbound</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#ff9900"></div>Walk</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#2e8b57"></div>Cruise</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#8e44ad"></div>Meet-up</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#cc0000"></div>Return</div>
    </div>
  </div>
  <div class="timeline-list" id="timeline-list"></div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const ROUTE_URL = "route.geojson";

  const itinerary = [
    {
      id: "depart",
      featureId: "fishermens-terminal",
      className: "outbound",
      time: "10:45 AM",
      title: "Depart Fishermen's Terminal",
      desc: "Casting off from Ballard and heading east through Salmon Bay toward the Fremont Cut.",
      tag: "Depart",
      tagClass: "tag-blue",
      zoom: 15
    },
    {
      id: "outbound-transit",
      featureId: "outbound-water",
      className: "outbound",
      time: "10:45 AM - 1:45 PM",
      title: "Salmon Bay to Lake Union to Montlake Cut",
      desc: "About 3 hours of relaxed cruising through the Ship Canal, Lake Union, and the Montlake Cut into Lake Washington.",
      tag: "Transit",
      tagClass: "tag-blue",
      focus: "bounds"
    },
    {
      id: "dock",
      featureId: "leschi-dock",
      className: "outbound",
      time: "1:45 PM",
      title: "Dock at BluWater Bistro",
      desc: "Tying up at the Leschi dock. Quick land stop and meet-up window happen from here.",
      tag: "Dock",
      tagClass: "tag-blue",
      zoom: 16
    },
    {
      id: "walk-out",
      featureId: "walking-land-stop",
      className: "walk",
      time: "1:50 - 1:55 PM",
      title: "Walk to Starbucks",
      desc: "Quick walk across Lakeside Ave from the BluWater dock.",
      tag: "Walk",
      tagClass: "tag-walk",
      zoom: 18
    },
    {
      id: "starbucks-meeting",
      featureId: "starbucks",
      className: "stop",
      time: "2:00 - 2:55 PM",
      title: "Starbucks meeting window",
      desc: "About 1 hour meeting. The boat stays coordinated near the BluWater dock.",
      tag: "Meeting",
      tagClass: "tag-stop",
      zoom: 18
    },
    {
      id: "steview",
      featureId: "steview-meet-up",
      className: "meet",
      time: "2:30 - 3:30 PM",
      title: "Stevie link-up",
      desc: "Stevie links up on the water near Leschi. Keep phones handy.",
      tag: "Meet-up",
      tagClass: "tag-meet",
      focus: "bounds"
    },
    {
      id: "walk-back",
      featureId: "walking-land-stop",
      className: "walk",
      time: "2:55 - 3:00 PM",
      title: "Walk back to the dock",
      desc: "Quick walk back across the street to the boat.",
      tag: "Walk",
      tagClass: "tag-walk",
      zoom: 18
    },
    {
      id: "cruise",
      featureId: "mercer-lake-loop",
      className: "chill",
      time: "3:30 - 7:00 PM",
      title: "Lake Washington celebration hangout",
      desc: "Looping around Mercer Island, then open-water cruising on Lake Washington.",
      tag: "Cruise",
      tagClass: "tag-chill",
      focus: "bounds"
    },
    {
      id: "mid-lake",
      featureId: "lake-center",
      className: "ret",
      time: "7:30 PM",
      title: "Point home from mid-lake",
      desc: "From near the center of Lake Washington, we start the inbound run back to Ballard.",
      tag: "Inbound",
      tagClass: "tag-red",
      zoom: 14
    },
    {
      id: "inbound-transit",
      featureId: "inbound-water",
      className: "ret",
      time: "7:30 - 8:30 PM",
      title: "Union Bay to Lake Union to Salmon Bay",
      desc: "About 1 hour inbound through Montlake Cut, Lake Union, Fremont Cut, and home via Salmon Bay.",
      tag: "Return",
      tagClass: "tag-red",
      focus: "bounds"
    },
    {
      id: "arrive",
      featureId: "fishermens-terminal",
      className: "ret",
      time: "8:30 PM",
      title: "Return to Fishermen's Terminal",
      desc: "Docked back in Ballard.",
      tag: "Home",
      tagClass: "tag-red",
      zoom: 15
    }
  ];

  const map = L.map("map", { zoomControl: false, preferCanvas: true }).setView([47.600, -122.290], 12);
  L.control.zoom({ position: "topleft" }).addTo(map);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
    attribution: "&copy; OpenStreetMap &copy; CARTO",
    subdomains: "abcd",
    maxZoom: 19
  }).addTo(map);

  const routeFeatures = new Map();
  const routeLayers = new Map();
  const baseStyles = new Map();
  let activeLayer = null;

  function escapeHtml(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function toLatLng(coord) {
    return [coord[1], coord[0]];
  }

  function lineToLatLngs(coords) {
    return coords.map(toLatLng);
  }

  function chaikin(points, iterations = 2) {
    let pts = points;
    for (let n = 0; n < iterations; n++) {
      const out = [pts[0]];
      for (let i = 0; i < pts.length - 1; i++) {
        const [aLat, aLng] = pts[i];
        const [bLat, bLng] = pts[i + 1];
        out.push([aLat * 0.75 + bLat * 0.25, aLng * 0.75 + bLng * 0.25]);
        out.push([aLat * 0.25 + bLat * 0.75, aLng * 0.25 + bLng * 0.75]);
      }
      out.push(pts[pts.length - 1]);
      pts = out;
    }
    return pts;
  }

  function isWalk(feature) {
    return (feature.properties.mode || "").toLowerCase().includes("walk");
  }

  function getLineStyle(feature) {
    const props = feature.properties;
    const id = props.id;
    const style = {
      color: props.stroke || "#0066cc",
      weight: props["stroke-width"] || 5,
      opacity: props["stroke-opacity"] || 0.95,
      lineCap: "round",
      lineJoin: "round"
    };

    if (id === "walking-land-stop") style.dashArray = "2,5";
    if (id === "mercer-lake-loop") style.dashArray = "10,8";
    if (id === "steview-meet-up") style.dashArray = "5,6";
    return style;
  }

  function popupHtml(feature) {
    const props = feature.properties || {};
    const meta = [props.time, props.mode].filter(Boolean).join(" | ");
    return [
      "<strong>" + escapeHtml(props.name) + "</strong>",
      meta ? '<div class="popup-meta">' + escapeHtml(meta) + "</div>" : "",
      props.description ? '<div class="popup-desc">' + escapeHtml(props.description) + "</div>" : ""
    ].join("");
  }

  function makeIcon(feature) {
    const props = feature.properties || {};
    const cls = props["marker-class"] || "";
    const label = props["marker-label"] || "";
    return L.divIcon({
      html: '<div class="marker-bubble ' + escapeHtml(cls) + '">' + escapeHtml(label) + "</div>",
      className: "",
      iconSize: [42, 42],
      iconAnchor: [21, 21]
    });
  }

  function drawFeature(feature) {
    const id = feature.properties.id;
    routeFeatures.set(id, feature);

    if (feature.geometry.type === "LineString") {
      const original = lineToLatLngs(feature.geometry.coordinates);
      const latLngs = isWalk(feature) ? original : chaikin(original, 2);
      const style = getLineStyle(feature);
      const layer = L.polyline(latLngs, style).addTo(map).bindPopup(popupHtml(feature));
      routeLayers.set(id, layer);
      baseStyles.set(id, style);
      return layer;
    }

    if (feature.geometry.type === "Point") {
      const layer = L.marker(toLatLng(feature.geometry.coordinates), { icon: makeIcon(feature) })
        .addTo(map)
        .bindPopup(popupHtml(feature));
      routeLayers.set(id, layer);
      return layer;
    }

    return null;
  }

  function resetActiveLayer() {
    if (!activeLayer) return;
    const id = activeLayer.featureId;
    const base = baseStyles.get(id);
    if (base && activeLayer.layer.setStyle) activeLayer.layer.setStyle(base);
    activeLayer = null;
  }

  function highlightLayer(id) {
    resetActiveLayer();
    const layer = routeLayers.get(id);
    const base = baseStyles.get(id);
    if (layer && base && layer.setStyle) {
      layer.setStyle({ ...base, weight: base.weight + 2, opacity: 1 });
      layer.bringToFront();
      activeLayer = { featureId: id, layer };
    }
  }

  function layerCenter(layer) {
    if (layer.getBounds) return layer.getBounds().getCenter();
    return layer.getLatLng();
  }

  function focusMap(item) {
    const layer = routeLayers.get(item.featureId);
    if (!layer) return;

    highlightLayer(item.featureId);
    if (item.focus === "bounds" && layer.getBounds) {
      map.fitBounds(layer.getBounds(), { padding: [42, 42], maxZoom: item.maxZoom || 14 });
      layer.openPopup(layer.getBounds().getCenter());
      return;
    }

    const center = layerCenter(layer);
    map.flyTo(center, item.zoom || 15, { duration: 0.9 });
    window.setTimeout(() => layer.openPopup(center), 450);
  }

  function renderTimeline() {
    const list = document.getElementById("timeline-list");
    list.innerHTML = "";
    itinerary.forEach((item, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tl-item " + item.className;
      button.dataset.itemId = item.id;
      button.innerHTML = [
        '<span class="tl-dot"></span>',
        '<div class="tl-time">' + escapeHtml(item.time) + "</div>",
        '<div class="tl-title">' + escapeHtml(item.title) + "</div>",
        '<div class="tl-desc">' + escapeHtml(item.desc) + "</div>",
        '<span class="tl-tag ' + escapeHtml(item.tagClass) + '">' + escapeHtml(item.tag) + "</span>"
      ].join("");
      button.addEventListener("click", () => {
        document.querySelectorAll(".tl-item").forEach(el => el.classList.remove("active"));
        button.classList.add("active");
        focusMap(item);
      });
      if (index === 0) button.classList.add("active");
      list.appendChild(button);
    });
  }

  function showLoadError() {
    const error = document.createElement("div");
    error.className = "load-error";
    error.textContent = "Route data could not be loaded. On GitHub Pages this should load normally; for local viewing, serve this folder with a small web server.";
    document.body.appendChild(error);
  }

  function addWakeCameo() {
    const wakeIcon = L.divIcon({
      html: '<div class="wake-easter" aria-hidden="true"><span></span></div>',
      className: "",
      iconSize: [42, 24],
      iconAnchor: [21, 12]
    });
    L.marker([47.6063, -122.2564], { icon: wakeIcon, zIndexOffset: 450 })
      .addTo(map)
      .bindPopup("<strong>Stevie link-up</strong><div class=\"popup-desc\">Stevie links up on the water near Leschi. Keep phones handy.</div>");
  }

  async function init() {
    renderTimeline();

    try {
      const response = await fetch(ROUTE_URL);
      if (!response.ok) throw new Error("Could not load route.geojson");
      const geojson = await response.json();
      const layers = geojson.features.map(drawFeature).filter(Boolean);
      const bounds = L.featureGroup(layers).getBounds();
      const walkLayer = routeLayers.get("walking-land-stop");
      if (walkLayer) walkLayer.bringToFront();
      addWakeCameo();
      if (bounds.isValid()) map.fitBounds(bounds, { padding: [42, 42] });
    } catch (error) {
      console.error(error);
      showLoadError();
    }
  }

  init();
</script>
</body>
</html>
